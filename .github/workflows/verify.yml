# Free end-to-end verification on GitHub Actions.
#
# The GitLab pipeline (.gitlab-ci.yml) is the "production" pipeline. This
# workflow proves every piece works on a clean machine: tests, lint, Docker
# build, Helm, Terraform, a real Kubernetes cluster (k3d), the NetworkPolicy,
# SBOM + cosign signing, and the Zarf package.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: ruff
        working-directory: app
        run: ruff check .
      - name: pytest (includes accuracy checks against Skyfield)
        working-directory: app
        run: pytest -v

  static:
    name: Helm + Terraform + ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: helm lint
        run: |
          helm lint charts/orbitwatch
          helm lint charts/orbitwatch-policy --set cosignPublicKey="dummy-key-for-lint"
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template t charts/orbitwatch --set serviceMonitor.enabled=false \
            | ./kubeconform -strict -summary -kubernetes-version 1.31.0
      - name: terraform fmt + validate
        run: |
          terraform fmt -check -recursive terraform
          for d in terraform/cluster terraform/aws-k3s; do
            echo "== $d"
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: shellcheck
        run: shellcheck scripts/*.sh

  e2e:
    name: Docker build + Kubernetes (k3d) end-to-end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install k3d
        run: curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.5 bash
      - name: Create cluster, build image, install chart (scripts/local-up.sh)
        run: ./scripts/local-up.sh
      - name: Pods are running as non-root with a read-only filesystem
        run: |
          kubectl -n orbitwatch get pods -o wide
          kubectl -n orbitwatch get deploy,svc,hpa,pdb,networkpolicy,configmap
          kubectl -n orbitwatch get pod -l app.kubernetes.io/name=orbitwatch \
            -o jsonpath='{range .items[*]}{.metadata.name} uid={.spec.securityContext.runAsUser} ro={.spec.containers[0].securityContext.readOnlyRootFilesystem}{"\n"}{end}'
      - name: Smoke-test the API from inside the namespace
        run: |
          set -x
          run() { kubectl -n orbitwatch run "$1" --rm -i --restart=Never --image=curlimages/curl:8.10.1 --command -- sh -c "$2"; }
          # A new pod's IP joins the NetworkPolicy allow-list a moment after it
          # starts, so wait for the first successful connection before testing.
          run smoke 'set -e
            for i in $(seq 30); do curl -sf -m 2 http://orbitwatch/healthz && break; sleep 1; done
            curl -sf http://orbitwatch/healthz
            curl -sf http://orbitwatch/satellites
            curl -sf http://orbitwatch/telemetry/99901
            curl -sf "http://orbitwatch/passes/99904?station=colorado-springs&hours=24"
            test "$(curl -s -o /dev/null -w "%{http_code}" http://orbitwatch/telemetry/00000)" = 404
            curl -sf http://orbitwatch/metrics | grep orbitwatch_tle_age_days'
      - name: NetworkPolicy blocks other namespaces
        run: |
          kubectl create namespace intruder
          # Same wait as above (8 tries), so a block is a real block, not a startup race
          if kubectl -n intruder run probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 --command -- \
               sh -c 'sleep 8; curl -s -m 5 http://orbitwatch.orbitwatch/healthz'; then
            echo "FAIL: a pod in another namespace reached OrbitWatch"; exit 1
          fi
          echo "PASS: traffic from namespace 'intruder' was blocked"
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n orbitwatch describe pods
          kubectl -n orbitwatch logs -l app.kubernetes.io/name=orbitwatch --tail=50

  supply-chain:
    name: SBOM + cosign sign/verify + Zarf package
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    env:
      IMAGE: localhost:5000/orbitwatch:${{ github.sha }}
      COSIGN_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build and push to a local registry
        run: |
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "DIGEST_REF=$DIGEST" >> "$GITHUB_ENV"
          echo "Image digest: $DIGEST"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Generate CycloneDX SBOM with Syft
        run: |
          syft "$IMAGE" -o cyclonedx-json=sbom.cdx.json
          echo "Components in SBOM: $(jq '.components | length' sbom.cdx.json)"
          jq -r '.components[].name' sbom.cdx.json | grep -E '^(fastapi|sgp4|uvicorn)$'
      - name: Sign by digest and attest the SBOM (offline, no transparency log)
        run: |
          cosign generate-key-pair
          cosign sign --yes --key cosign.key --tlog-upload=false "$DIGEST_REF"
          cosign attest --yes --key cosign.key --tlog-upload=false \
            --type cyclonedx --predicate sbom.cdx.json "$DIGEST_REF"
      - name: Verify signature and attestation
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "$DIGEST_REF" | jq .
          cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true \
            --type cyclonedx "$DIGEST_REF" > /dev/null
          echo "PASS: signature and SBOM attestation verified"
      - name: Tampered image fails verification
        run: |
          docker build -t localhost:5000/orbitwatch:tampered --build-arg APP_VERSION=evil app
          docker push localhost:5000/orbitwatch:tampered
          if cosign verify --key cosign.pub --insecure-ignore-tlog=true localhost:5000/orbitwatch:tampered; then
            echo "FAIL: unsigned image verified"; exit 1
          fi
          echo "PASS: unsigned image was rejected"
      - name: Build the Zarf package
        run: |
          curl -sSL -o /usr/local/bin/zarf https://github.com/zarf-dev/zarf/releases/download/v0.43.0/zarf_v0.43.0_Linux_amd64
          chmod +x /usr/local/bin/zarf
          IMAGE_REF="$IMAGE" ./scripts/zarf-package.sh
          ls -lh dist/
          zarf package inspect dist/*.tar.zst --no-color | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-zarf
          path: |
            sbom.cdx.json
            dist/*.tar.zst
