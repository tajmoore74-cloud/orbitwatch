{{- /*
Only create the PDB when there are at least 2 pods. With a single pod,
"minAvailable: 1" would block every node drain forever.
*/ -}}
{{- $replicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orbitwatch.fullname" . }}
  labels:
    {{- include "orbitwatch.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "orbitwatch.selectorLabels" . | nindent 6 }}
{{- end }}
