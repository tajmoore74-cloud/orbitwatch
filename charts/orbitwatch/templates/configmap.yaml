{{- if or .Values.tle.data .Values.stations }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbitwatch.fullname" . }}-config
  labels:
    {{- include "orbitwatch.labels" . | nindent 4 }}
data:
  {{- with .Values.tle.data }}
  satellites.tle: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.stations }}
  stations.json: |
    {{- toPrettyJson . | nindent 4 }}
  {{- end }}
{{- end }}
